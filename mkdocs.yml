site_name: Documentacion Moodle Matrix Plugin
site_description: Sincronización de Moodle, Matrix y Obsidian.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

nav:
  - Proyecto Principal: index.md
  - Entorno Docker y Matrix:
    - General: moodle-matrix-dev/index.md
    - Docker y Configuración: moodle-matrix-dev/docker.md
    - Scripts de Usuarios: moodle-matrix-dev/usuarios/index.md
    - LLM Wiki Assistant (Maubot):
      - Comandos del Maubot: moodle-matrix-dev/maubot/comandos_maubot.md
      - Configuración y Despliegue: moodle-matrix-dev/maubot/index.md
      - moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant:
        - __init__.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/__init__.md
        - bot.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/bot.md
        - check_empty.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/check_empty.md
        - check_missing_links.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/check_missing_links.md
        - db.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/db.md
        - ejecutar_ingesta_lotes.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/ejecutar_ingesta_lotes.md
        - estudio.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/estudio.md
        - git_client.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/git_client.md
        - image_ocr.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/image_ocr.md
        - latex_render.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/latex_render.md
        - llm_provider.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/llm_provider.md
        - okf_ingest.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/okf_ingest.md
        - organizacion.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/organizacion.md
        - pdf_ingest.py: moodle-matrix-dev/maubot/llm-wiki-assistant-plugin/llm_wiki_assistant/pdf_ingest.md
  - Plugin Gitmetrics:
    - General: gitmetrics/index.md
    - Estructura: gitmetrics/estructura.md
    - Scripts CLI: gitmetrics/cli/index.md
    - Archivos Base:
      - block_gitmetrics: gitmetrics/block_gitmetrics.md
      - edit_form: gitmetrics/edit_form.md
      - lib: gitmetrics/lib.md
      - renderer: gitmetrics/renderer.md
      - settings: gitmetrics/settings.md
      - version: gitmetrics/version.md
      - view: gitmetrics/view.md
      - view_file: gitmetrics/view_file.md
    - Clases y Flujos:
      - metrics_calculator: gitmetrics/classes/metrics_calculator.md
      - obsidian_exporter: gitmetrics/classes/obsidian_exporter.md
      - Tarea sync_obsidian: gitmetrics/classes/task/sync_obsidian.md
      - github_client: gitmetrics/classes/github_client.md
      - gitlab_client: gitmetrics/classes/gitlab_client.md
      - git_provider_interface: gitmetrics/classes/git_provider_interface.md
      - markdown_parser: gitmetrics/classes/markdown_parser.md
      - matrix_helper: gitmetrics/classes/matrix_helper.md
      - metrics_cache: gitmetrics/classes/metrics_cache.md

# Aquí puedes incluir plugins para generar documentación desde el código
plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: "."
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

watch:
  - README.md
  - gitmetrics
  - moodle-matrix-dev